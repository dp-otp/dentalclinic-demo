<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hex Grid Working</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #debug {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="debug">Initializing...</div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';

        const debug = document.getElementById('debug');

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Camera setup
        const camera = new THREE.OrthographicCamera(
            -window.innerWidth / 2,
            window.innerWidth / 2,
            window.innerHeight / 2,
            -window.innerHeight / 2,
            1,
            1000
        );
        camera.position.z = 500;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Generate hexagon grid
        const hexRadius = 55;
        const hexWidth = hexRadius * Math.sqrt(3);
        const hexHeight = hexRadius * 1.5;

        const cols = Math.ceil(window.innerWidth / hexWidth) + 3;
        const rows = Math.ceil(window.innerHeight / hexHeight) + 3;

        const hexagons = [];
        const group = new THREE.Group();

        for (let row = -1; row < rows; row++) {
            for (let col = -1; col < cols; col++) {
                const xOffset = (row % 2) * (hexWidth / 2);
                const x = col * hexWidth + xOffset - window.innerWidth / 2;
                const y = row * hexHeight - window.innerHeight / 2;

                // Create hexagon outline (3 layers)
                for (let layer = 0; layer < 3; layer++) {
                    const layerRadius = hexRadius + (layer - 1) * 3;
                    const points = [];

                    for (let i = 0; i <= 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        points.push(new THREE.Vector3(
                            x + Math.cos(angle) * layerRadius,
                            y + Math.sin(angle) * layerRadius,
                            0
                        ));
                    }

                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({
                        color: layer === 1 ? 0x00ff88 : 0x008866,
                        opacity: 0.6,
                        transparent: true
                    });

                    const line = new THREE.Line(geometry, material);
                    group.add(line);
                    hexagons.push({ line, x, y, layer });
                }
            }
        }

        scene.add(group);

        debug.innerHTML = `✓ Grid created: ${hexagons.length} line segments<br>` +
                         `Hexagons: ${Math.floor(hexagons.length / 3)}<br>` +
                         `Resolution: ${window.innerWidth}x${window.innerHeight}<br>` +
                         `FPS: <span id="fps">--</span>`;

        // Animation
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            // Update FPS
            frameCount++;
            if (time - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = time;
                document.getElementById('fps').textContent = fps;
            }

            // Animate opacity based on diagonal wave
            const waveTime = (time * 0.0003) % 2; // 0-2 cycle

            hexagons.forEach(({ line, x, y }) => {
                // Calculate diagonal position (0-1)
                const diagX = (x + window.innerWidth / 2) / window.innerWidth;
                const diagY = 1 - (y + window.innerHeight / 2) / window.innerHeight;
                const diagonal = (diagX + diagY) / 2;

                // Wave distance
                const dist = Math.abs(diagonal - waveTime);

                // Fade based on distance from wave
                let opacity;
                if (dist < 0.1) {
                    opacity = 1.0; // Wave peak
                } else if (dist < 0.3) {
                    opacity = 0.8; // Near wave
                } else {
                    opacity = 0.3; // Far from wave
                }

                line.material.opacity = opacity;
            });

            renderer.render(scene, camera);
        }

        animate(0);

        // Handle resize
        window.addEventListener('resize', () => {
            camera.left = -window.innerWidth / 2;
            camera.right = window.innerWidth / 2;
            camera.top = window.innerHeight / 2;
            camera.bottom = -window.innerHeight / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
