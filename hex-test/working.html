<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Working Hex Grid</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #f5ebe4; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5ebe4);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Simple hex grid - 10x10
    const hexRadius = 0.8;
    const spacing = 1.5;

    for (let row = 0; row < 10; row++) {
      for (let col = 0; col < 10; col++) {
        const xOffset = (row % 2) * (spacing * 0.5);
        const x = col * spacing - 7 + xOffset;
        const y = row * spacing * 0.85 - 5;

        // Create single hexagon
        const points = [];
        for (let i = 0; i <= 6; i++) {
          const angle = (Math.PI / 3) * (i % 6);
          const px = hexRadius * Math.cos(angle);
          const py = hexRadius * Math.sin(angle);
          points.push(new THREE.Vector3(px, py, 0));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0x00ffff,
          transparent: true,
          opacity: 0.8
        });

        const hex = new THREE.Line(geometry, material);
        hex.position.set(x, y, 0);
        scene.add(hex);
      }
    }

    console.log('Created hex grid');

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
