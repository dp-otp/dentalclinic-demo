<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Hex Outline Test</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #f5ebe4; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5ebe4);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Create a single hexagon outline to test
    const hexRadius = 0.5;
    const points = [];

    // Create hexagon vertices in a loop
    for (let i = 0; i <= 6; i++) {
      const angle = (Math.PI / 3) * i;
      const x = hexRadius * Math.cos(angle);
      const y = hexRadius * Math.sin(angle);
      points.push(new THREE.Vector3(x, y, 0));
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
      color: 0x00ffff,
      linewidth: 2
    });

    const hexLine = new THREE.Line(geometry, material);
    scene.add(hexLine);

    console.log('Created single hex outline test');

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
