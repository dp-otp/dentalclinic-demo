<!-- Preview Frame: t=12.0s (100%) - Die & Loop Reset -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#0B0C0E">
  <defs>
    <filter id="glow_trace_final">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <path id="unit" d="M 9,0 L 55,0 L 64,9 L 64,55 L 55,64 L 9,64 L 0,55 L 0,9 Z"/>
  </defs>

  <!-- Full cycle complete: all returning to faint traces, top-left slightly more visible -->
  <g filter="url(#glow_trace_final)">
    <!-- Bottom-right: back to minimal traces (opacity 0.03-0.05) -->
    <use href="#unit" x="920" y="650" transform="rotate(-3 952 682)" opacity="0.04" stroke="rgba(215,122,0,0.04)" stroke-width="0.8" fill="none"/>
    <use href="#unit" x="1020" y="690" transform="rotate(2 1052 722)" opacity="0.03" stroke="rgba(215,122,0,0.03)" stroke-width="0.8" fill="none"/>

    <!-- Middle diagonal: fading fast (opacity 0.06-0.10) -->
    <use href="#unit" x="780" y="580" transform="rotate(4 812 612)" opacity="0.09" stroke="rgba(215,122,0,0.09)" stroke-width="0.9" fill="none"/>
    <use href="#unit" x="890" y="550" transform="rotate(-2 922 582)" opacity="0.08" stroke="rgba(215,122,0,0.08)" stroke-width="0.9" fill="none"/>
    <use href="#unit" x="1000" y="590" transform="rotate(1 1032 622)" opacity="0.08" stroke="rgba(215,122,0,0.08)" stroke-width="0.9" fill="none"/>

    <use href="#unit" x="650" y="480" transform="rotate(-4 682 512)" opacity="0.10" stroke="rgba(215,122,0,0.10)" stroke-width="0.9" fill="none"/>
    <use href="#unit" x="760" y="450" transform="rotate(3 792 482)" opacity="0.11" stroke="rgba(215,122,0,0.11)" stroke-width="0.9" fill="none"/>
    <use href="#unit" x="870" y="420" transform="rotate(-1 902 452)" opacity="0.12" stroke="rgba(215,122,0,0.12)" stroke-width="0.9" fill="none"/>

    <!-- Top-left: decay final stage (opacity 0.15-0.22) - last to fade -->
    <use href="#unit" x="520" y="380" transform="rotate(2 552 412)" opacity="0.22" stroke="rgba(215,122,0,0.22)" stroke-width="1.0" fill="none"/>
    <use href="#unit" x="630" y="320" transform="rotate(-3 662 352)" opacity="0.19" stroke="rgba(215,122,0,0.19)" stroke-width="1.0" fill="none"/>
    <use href="#unit" x="400" y="250" transform="rotate(4 432 282)" opacity="0.17" stroke="rgba(215,122,0,0.17)" stroke-width="0.95" fill="none"/>
    <use href="#unit" x="290" y="180" transform="rotate(-2 322 212)" opacity="0.15" stroke="rgba(215,122,0,0.15)" stroke-width="0.95" fill="none"/>

    <!-- Far top-left: entering fade (opacity 0.12-0.14) -->
    <use href="#unit" x="180" y="120" transform="rotate(3 212 152)" opacity="0.13" stroke="rgba(215,122,0,0.13)" stroke-width="0.9" fill="none"/>
    <use href="#unit" x="70" y="50" transform="rotate(-4 102 82)" opacity="0.12" stroke="rgba(215,122,0,0.12)" stroke-width="0.9" fill="none"/>
  </g>

  <!-- Loop arrow indicator -->
  <g transform="translate(1100 100)">
    <circle r="25" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>
    <path d="M 25,0 A 25,25 0 1,1 -25,0" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.6" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#00E5FF"/>
      </marker>
    </defs>
  </g>

  <text x="20" y="40" fill="#00E5FF" font-family="monospace" font-size="16">t=12.0s | Phase: Die &amp; Loop (100%) | Full cycle complete, returning to t=0</text>
  <text x="20" y="70" fill="#8AFFC1" font-family="monospace" font-size="14">Diagonal sweep complete: bottom-right → top-left evolution demonstrated</text>
</svg>
