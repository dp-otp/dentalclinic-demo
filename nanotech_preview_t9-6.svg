<!-- Preview Frame: t=9.6s (80%) - Decay Phase Begins -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#0B0C0E">
  <defs>
    <filter id="glow_decay">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bloom_fading">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="unit" d="M 9,0 L 55,0 L 64,9 L 64,55 L 55,64 L 9,64 L 0,55 L 0,9 Z"/>
    <circle id="node_faint" r="3"/>
  </defs>

  <!-- Decay: bloom losing strength, filaments dimming, top-left at peak now -->

  <!-- Bottom-right: decay active (opacity 0.55-0.7, bloom fading) -->
  <g filter="url(#bloom_fading)">
    <use href="#unit" x="920" y="650" transform="rotate(-3 952 682)" opacity="0.68" stroke="#D77A00" stroke-width="1.9" fill="none"/>
    <use href="#node_faint" x="952" y="682" fill="#D77A00" opacity="0.5"/>

    <use href="#unit" x="1020" y="690" transform="rotate(2 1052 722)" opacity="0.62" stroke="#D77A00" stroke-width="1.8" fill="none"/>
    <use href="#node_faint" x="1052" y="722" fill="#00E5FF" opacity="0.45"/>
  </g>

  <!-- Middle diagonal: past peak, dimming (opacity 0.75-0.9) -->
  <g filter="url(#glow_decay)">
    <use href="#unit" x="780" y="580" transform="rotate(4 812 612)" opacity="0.88" stroke="#D77A00" stroke-width="2.1" fill="none"/>
    <circle cx="812" cy="612" r="4" fill="#D77A00" opacity="0.75"/>

    <use href="#unit" x="890" y="550" transform="rotate(-2 922 582)" opacity="0.82" stroke="#D77A00" stroke-width="2.0" fill="none"/>
    <circle cx="922" cy="582" r="4" fill="#00E5FF" opacity="0.7"/>

    <use href="#unit" x="1000" y="590" transform="rotate(1 1032 622)" opacity="0.85" stroke="#D77A00" stroke-width="2.0" fill="none"/>

    <use href="#unit" x="650" y="480" transform="rotate(-4 682 512)" opacity="0.78" stroke="#D77A00" stroke-width="1.9" fill="none"/>
  </g>

  <!-- Top-left: NOW AT PEAK (opacity 0.9-1.0, bloom active) -->
  <g filter="url(#bloom_fading)">
    <use href="#unit" x="520" y="380" transform="rotate(2 552 412)" opacity="0.95" stroke="#D77A00" stroke-width="2.3" fill="rgba(215,122,0,0.06)"/>
    <circle cx="552" cy="412" r="5" fill="#D77A00" opacity="0.95"/>
    <circle cx="552" cy="412" r="15" fill="rgba(215,122,0,0.15)" opacity="0.6"/>

    <use href="#unit" x="630" y="320" transform="rotate(-3 662 352)" opacity="0.92" stroke="#00E5FF" stroke-width="2.2" fill="rgba(0,229,255,0.05)"/>
    <circle cx="662" cy="352" r="5" fill="#00E5FF" opacity="0.9"/>

    <use href="#unit" x="400" y="250" transform="rotate(4 432 282)" opacity="0.88" stroke="#D77A00" stroke-width="2.1" fill="none"/>
    <circle cx="432" cy="282" r="4" fill="#8AFFC1" opacity="0.8"/>
  </g>

  <!-- Far top-left: entering peak (opacity 0.7-0.8) -->
  <g filter="url(#glow_decay)">
    <use href="#unit" x="290" y="180" transform="rotate(-2 322 212)" opacity="0.75" stroke="#D77A00" stroke-width="1.9" fill="none"/>
    <use href="#unit" x="180" y="120" transform="rotate(3 212 152)" opacity="0.68" stroke="#D77A00" stroke-width="1.8" fill="none"/>
  </g>

  <text x="20" y="40" fill="#00E5FF" font-family="monospace" font-size="16">t=9.6s | Phase: Decay (80%) | Diagonal sweep: bottom-right fading, top-left peaking</text>
