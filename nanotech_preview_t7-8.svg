<!-- Preview Frame: t=7.8s (65%) - Peak Zone with Nano Flip/Merge -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#0B0C0E">
  <defs>
    <filter id="bloom_peak">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow_standard">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <path id="unit" d="M 9,0 L 55,0 L 64,9 L 64,55 L 55,64 L 9,64 L 0,55 L 0,9 Z"/>
    <circle id="spark" r="2"/>
    <circle id="node" r="5"/>
  </defs>

  <!-- Peak zone: full neon lines, bloom, center nodes, nano flip in progress -->

  <!-- Bottom-right: PEAK BRIGHTNESS (opacity 0.95-1.0, full bloom) -->
  <g filter="url(#bloom_peak)">
    <!-- Nano flip: two converging units with rotation and merge -->
    <g transform="translate(920 650)">
      <use href="#unit" transform="rotate(-12)" opacity="1.0" stroke="#D77A00" stroke-width="2.5" fill="rgba(215,122,0,0.08)"/>
      <use href="#node" fill="#D77A00" opacity="1.0"/>
      <!-- Merge flash -->
      <circle r="20" fill="rgba(255,255,255,0.3)" opacity="0.8"/>
      <!-- Assembly particles -->
      <use href="#spark" x="-15" y="-10" fill="#8AFFC1" opacity="0.9"/>
      <use href="#spark" x="12" y="-8" fill="#00E5FF" opacity="0.9"/>
      <use href="#spark" x="-8" y="14" fill="#D77A00" opacity="0.8"/>
      <use href="#spark" x="10" y="12" fill="#8AFFC1" opacity="0.9"/>
    </g>

    <g transform="translate(1020 690)">
      <use href="#unit" transform="rotate(15)" opacity="0.98" stroke="#00E5FF" stroke-width="2.5" fill="rgba(0,229,255,0.06)"/>
      <use href="#node" fill="#00E5FF" opacity="1.0"/>
      <circle r="18" fill="rgba(0,229,255,0.2)" opacity="0.7"/>
    </g>

    <!-- Connecting energy beam between merge points -->
    <line x1="920" y1="650" x2="1020" y2="690" stroke="#8AFFC1" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Middle diagonal: entering peak (opacity 0.7-0.85) -->
  <g filter="url(#glow_standard)">
    <use href="#unit" x="780" y="580" transform="rotate(4 812 612)" opacity="0.85" stroke="#D77A00" stroke-width="2.2" fill="none"/>
    <circle cx="812" cy="612" r="4" fill="#D77A00" opacity="0.8"/>

    <use href="#unit" x="890" y="550" transform="rotate(-2 922 582)" opacity="0.78" stroke="#D77A00" stroke-width="2.0" fill="none"/>
    <circle cx="922" cy="582" r="4" fill="#00E5FF" opacity="0.7"/>

    <use href="#unit" x="1000" y="590" transform="rotate(1 1032 622)" opacity="0.82" stroke="#D77A00" stroke-width="2.1" fill="none"/>

    <use href="#unit" x="650" y="480" transform="rotate(-4 682 512)" opacity="0.72" stroke="#D77A00" stroke-width="1.9" fill="none"/>
    <use href="#unit" x="760" y="450" transform="rotate(3 792 482)" opacity="0.68" stroke="#D77A00" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Top-left: stepping-stone phase (opacity 0.4-0.6) -->
  <g filter="url(#glow_standard)">
    <use href="#unit" x="520" y="380" transform="rotate(2 552 412)" opacity="0.58" stroke="#D77A00" stroke-width="1.6" fill="none"/>
    <use href="#unit" x="630" y="320" transform="rotate(-3 662 352)" opacity="0.52" stroke="#D77A00" stroke-width="1.5" fill="none"/>
    <use href="#unit" x="400" y="250" transform="rotate(4 432 282)" opacity="0.45" stroke="#D77A00" stroke-width="1.4" fill="none"/>
    <use href="#unit" x="290" y="180" transform="rotate(-2 322 212)" opacity="0.40" stroke="#D77A00" stroke-width="1.3" fill="none"/>
  </g>

  <text x="20" y="40" fill="#00E5FF" font-family="monospace" font-size="16">t=7.8s | Phase: PEAK + NANO FLIP (65%) | Opacity: 0.40-1.0 | Bloom + Merge active</text>
</svg>
