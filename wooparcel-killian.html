<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WooParcel | Ship Smarter with Killian</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       CSS VARIABLES & DESIGN TOKENS
       ============================================ */
    :root {
      --bg-obsidian: #08080a;
      --bg-elevated: rgba(255, 255, 255, 0.02);
      --surface-glass: rgba(255, 255, 255, 0.03);
      --surface-glass-hover: rgba(255, 255, 255, 0.06);

      --accent-woop: #E07800;
      --accent-woop-light: #FF9A3C;
      --accent-glow: #FFD699;
      --accent-subtle: rgba(224, 120, 0, 0.15);

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);

      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-glow: rgba(224, 120, 0, 0.4);

      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    /* ============================================
       RESET & BASE STYLES
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-obsidian);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ============================================
       GLOBE BACKGROUND LAYER
       ============================================ */
    #globe-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .globe-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(
        ellipse at 50% 30%,
        rgba(8, 8, 10, 0.4) 0%,
        rgba(8, 8, 10, 0.7) 50%,
        rgba(8, 8, 10, 0.85) 100%
      );
      pointer-events: none;
    }

    /* ============================================
       NAVIGATION
       ============================================ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(8, 8, 10, 0.5);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s var(--ease-premium);
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-woop);
      transition: width 0.3s var(--ease-premium);
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* ============================================
       MAIN CONTENT LAYER
       ============================================ */
    .main-content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
    }

    /* ============================================
       HERO SECTION
       ============================================ */
    .hero {
      text-align: center;
      margin-bottom: 40px;
      max-width: 800px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--accent-subtle);
      border: 1px solid var(--border-glow);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-woop-light);
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s var(--ease-premium) 0.2s forwards;
    }

    .hero-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent-woop);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero-title .line {
      display: block;
      overflow: hidden;
    }

    .hero-title .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%);
      animation: slideUp 0.8s var(--ease-premium) forwards;
    }

    .hero-title .line:nth-child(1) .word { animation-delay: 0.3s; }
    .hero-title .line:nth-child(2) .word { animation-delay: 0.45s; }

    .hero-title .gradient {
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 50%, var(--accent-woop) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-premium) 0.6s forwards;
    }

    .hero-scroll-indicator {
      margin-top: 32px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-premium) 1s forwards, bounce 2s ease-in-out 1.8s infinite;
      color: var(--text-muted);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* ============================================
       CHAT CONTAINER (KILLIAN)
       ============================================ */
    .chat-container {
      width: 100%;
      max-width: 520px;
      background: var(--surface-glass);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.5),
        0 0 120px rgba(224, 120, 0, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      animation: chatReveal 1s var(--ease-premium) 0.8s forwards;
    }

    /* Chat Header */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.2);
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--bg-obsidian);
      position: relative;
    }

    .chat-avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 100%);
      z-index: -1;
      opacity: 0.3;
      animation: avatarPulse 2s ease-in-out infinite;
    }

    .chat-info h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: statusPulse 2s ease-in-out infinite;
    }

    /* Chat Messages */
    .chat-messages {
      height: 360px;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 3px;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      gap: 12px;
      max-width: 90%;
      animation: messageIn 0.4s var(--ease-bounce);
    }

    .message.killian {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--bg-obsidian);
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--surface-glass-hover);
      color: var(--text-primary);
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    .message.killian .message-bubble {
      background: var(--surface-glass-hover);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-woop-light) 100%);
      color: var(--bg-obsidian);
      border-bottom-right-radius: 4px;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
      background: var(--surface-glass-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Quick Actions (Cards) */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 24px 20px;
    }

    .action-card {
      flex: 1 1 calc(50% - 5px);
      min-width: 140px;
      padding: 16px;
      background: var(--surface-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s var(--ease-premium);
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .action-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(224, 120, 0, 0.1) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s var(--ease-premium);
    }

    .action-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(224, 120, 0, 0.15);
    }

    .action-card:hover::before {
      opacity: 1;
    }

    .action-card:active {
      transform: translateY(0) scale(0.98);
    }

    .action-card-icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .action-card-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .action-card-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Chat Input */
    .chat-input-area {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.2);
    }

    .chat-input {
      flex: 1;
      background: var(--surface-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      font-size: 0.9375rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s var(--ease-premium);
      font-family: inherit;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .chat-input:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 4px rgba(224, 120, 0, 0.1);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-woop-light) 100%);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease-premium);
      position: relative;
      overflow: hidden;
    }

    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
      transform: translateX(-100%);
      transition: transform 0.5s var(--ease-premium);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(224, 120, 0, 0.4);
    }

    .send-btn:hover::before {
      transform: translateX(100%);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--bg-obsidian);
      position: relative;
      z-index: 1;
    }

    /* ============================================
       PREMIUM BUTTONS
       ============================================ */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-woop-light) 100%);
      border: none;
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-weight: 600;
      color: var(--bg-obsidian);
      cursor: pointer;
      transition: all 0.4s var(--ease-premium);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      transform: translateX(-100%) skewX(-15deg);
      transition: transform 0.6s var(--ease-premium);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow:
        0 20px 40px rgba(224, 120, 0, 0.3),
        0 0 60px rgba(224, 120, 0, 0.15);
    }

    .btn-primary:hover::before {
      transform: translateX(100%) skewX(-15deg);
    }

    .btn-primary:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chatReveal {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.1; }
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    @keyframes cardReveal {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ============================================
       MAGNETIC EFFECT (Applied via JS)
       ============================================ */
    .magnetic {
      transition: transform 0.3s var(--ease-premium);
    }

    /* ============================================
       CUSTOM CURSOR
       ============================================ */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid var(--accent-woop);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s var(--ease-smooth), opacity 0.3s, width 0.3s, height 0.3s, border-color 0.3s;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    .cursor.hover {
      width: 50px;
      height: 50px;
      border-color: var(--accent-glow);
      background: rgba(224, 120, 0, 0.1);
    }

    .cursor-dot {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--accent-woop);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s;
    }

    @media (hover: none) {
      .cursor, .cursor-dot { display: none; }
    }

    /* ============================================
       CHARACTER TEXT REVEAL
       ============================================ */
    .char-reveal {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px) rotateX(-40deg);
      animation: charReveal 0.5s var(--ease-premium) forwards;
    }

    @keyframes charReveal {
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
    }

    /* ============================================
       GLOW EFFECTS
       ============================================ */
    .glow-text {
      text-shadow:
        0 0 20px rgba(224, 120, 0, 0.5),
        0 0 40px rgba(224, 120, 0, 0.3),
        0 0 60px rgba(224, 120, 0, 0.1);
    }

    .glow-border {
      box-shadow:
        0 0 20px rgba(224, 120, 0, 0.3),
        0 0 40px rgba(224, 120, 0, 0.1),
        inset 0 0 20px rgba(224, 120, 0, 0.05);
    }

    /* ============================================
       FLOATING PARTICLES (CSS Only)
       ============================================ */
    .floating-particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--accent-woop);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.3;
      z-index: 2;
    }

    .floating-particle:nth-child(1) { top: 20%; left: 10%; animation: floatParticle 8s ease-in-out infinite; }
    .floating-particle:nth-child(2) { top: 60%; left: 85%; animation: floatParticle 10s ease-in-out infinite 1s; }
    .floating-particle:nth-child(3) { top: 80%; left: 20%; animation: floatParticle 12s ease-in-out infinite 2s; }
    .floating-particle:nth-child(4) { top: 30%; left: 70%; animation: floatParticle 9s ease-in-out infinite 0.5s; }
    .floating-particle:nth-child(5) { top: 70%; left: 50%; animation: floatParticle 11s ease-in-out infinite 1.5s; }

    @keyframes floatParticle {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      25% { transform: translate(20px, -30px) scale(1.2); opacity: 0.5; }
      50% { transform: translate(-10px, -50px) scale(0.8); opacity: 0.2; }
      75% { transform: translate(30px, -20px) scale(1.1); opacity: 0.4; }
    }

    /* ============================================
       NOISE TEXTURE OVERLAY
       ============================================ */
    .noise-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 640px) {
      .nav {
        padding: 16px 20px;
      }

      .nav-links {
        display: none;
      }

      .main-content {
        padding: 100px 16px 40px;
      }

      .hero-title {
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .chat-container {
        max-width: 100%;
        border-radius: var(--radius-lg);
      }

      .chat-messages {
        height: 300px;
      }

      .action-card {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Floating Particles -->
  <div class="floating-particle"></div>
  <div class="floating-particle"></div>

  <script>
    // ============================================
    // GLOBE BACKGROUND
    // ============================================
    function initGlobe() {
      fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
        .then(r => r.json())
        .then(geoData => createGlobe(geoData))
        .catch(() => createGlobe(null));
    }

    function createGlobe(geoData) {
      const container = document.getElementById('globe-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08080a);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0, 4.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.4, 0.5, 0.85
      );
      composer.addPass(bloomPass);

      const R = 1.7;
      const globeGroup = new THREE.Group();
      scene.add(globeGroup);
      globeGroup.rotation.y = -Math.PI * 0.15;

      function latLonToVec3(lat, lon, r) {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = (lon + 180) * Math.PI / 180;
        return new THREE.Vector3(
          -r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      const NEON_ORANGE = 0xE07800;

      // Country borders
      if (geoData) {
        const countryMat = new THREE.LineBasicMaterial({ color: NEON_ORANGE, transparent: true, opacity: 0.5 });
        geoData.features.forEach(f => {
          const g = f.geometry;
          const draw = (coords) => {
            const pts = coords.map(c => latLonToVec3(c[1], c[0], R));
            if (pts.length > 2) globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), countryMat));
          };
          if (g.type === 'Polygon') g.coordinates.forEach(draw);
          else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => p.forEach(draw));
        });
      }

      // Grid
      const gridMat = new THREE.LineBasicMaterial({ color: NEON_ORANGE, transparent: true, opacity: 0.06 });
      for (let lat = -60; lat <= 60; lat += 30) {
        const pts = [];
        for (let lon = 0; lon <= 360; lon += 5) pts.push(latLonToVec3(lat, lon, R));
        globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }
      for (let lon = 0; lon < 360; lon += 30) {
        const pts = [];
        for (let lat = -90; lat <= 90; lat += 5) pts.push(latLonToVec3(lat, lon, R));
        globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }

      // Atmosphere glow
      const glowGeo = new THREE.SphereGeometry(R * 1.06, 64, 64);
      const glowMat = new THREE.ShaderMaterial({
        uniforms: { glowColor: { value: new THREE.Color(NEON_ORANGE) } },
        vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 glowColor; varying vec3 vNormal; void main() { float i = pow(0.5 - dot(vNormal, vec3(0,0,1)), 3.0); gl_FragColor = vec4(glowColor, i * 0.08); }`,
        side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true
      });
      globeGroup.add(new THREE.Mesh(glowGeo, glowMat));

      // Shooting lines
      const lineRoutes = [
        { from: [5, -52], to: [14.7, -17.4] },
        { from: [51.5, -0.12], to: [41.01, 28.98] },
        { from: [48.9, 2.35], to: [30.04, 31.24] },
        { from: [52.5, 13.4], to: [55.75, 37.6] },
        { from: [40.7, -74], to: [34.05, -118.2] },
        { from: [35.7, 139.7], to: [22.3, 114.2] },
      ];

      function createLineArc(from, to) {
        const start = latLonToVec3(from[0], from[1], R);
        const end = latLonToVec3(to[0], to[1], R);
        const pts = [];
        const dist = start.distanceTo(end);
        const height = Math.min(dist * 0.12, 0.25);
        for (let i = 0; i <= 60; i++) {
          const t = i / 60;
          const pt = new THREE.Vector3().lerpVectors(start, end, t);
          pt.normalize();
          pt.multiplyScalar(R * 1.02 + Math.sin(t * Math.PI) * height);
          pts.push(pt);
        }
        return pts;
      }

      const shootingLines = [];
      lineRoutes.forEach((route, i) => {
        const arcPts = createLineArc(route.from, route.to);
        const dot = new THREE.Mesh(
          new THREE.CircleGeometry(0.012, 16),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
        );
        const lineGeo = new THREE.BufferGeometry();
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
        const line = new THREE.Line(lineGeo, lineMat);
        globeGroup.add(dot);
        globeGroup.add(line);
        shootingLines.push({ dot, line, lineGeo, lineMat, arcPts, progress: i / lineRoutes.length, speed: 0.0012 });
      });

      // Particles
      const partGeo = new THREE.BufferGeometry();
      const partPos = new Float32Array(50 * 3);
      for (let i = 0; i < 50; i++) {
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        const rad = R * (1.1 + Math.random() * 0.4);
        partPos[i*3] = rad * Math.sin(ph) * Math.cos(th);
        partPos[i*3+1] = rad * Math.sin(ph) * Math.sin(th);
        partPos[i*3+2] = rad * Math.cos(ph);
      }
      partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
      const particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ color: 0xFFF8F0, size: 0.006, transparent: true, opacity: 0.2 }));
      globeGroup.add(particles);

      // Animation
      const clock = new THREE.Clock();
      let time = 0;
      let globeRotY = -Math.PI * 0.15;

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        time += delta;

        // Continuous slow rotation
        globeRotY += 0.0006;
        globeGroup.rotation.y = globeRotY;

        // Subtle floating
        globeGroup.position.y = Math.sin(time * 0.5) * 0.015;

        // Shooting lines
        shootingLines.forEach(sl => {
          sl.progress += sl.speed;
          if (sl.progress >= 1) sl.progress = 0;

          const t = sl.progress;
          const totalPts = sl.arcPts.length;
          const exactIdx = t * (totalPts - 1);
          const idx1 = Math.floor(exactIdx);
          const idx2 = Math.min(idx1 + 1, totalPts - 1);
          const frac = exactIdx - idx1;
          const pos = new THREE.Vector3().lerpVectors(sl.arcPts[idx1], sl.arcPts[idx2], frac);

          sl.dot.position.copy(pos);
          sl.dot.lookAt(0, 0, 0);

          const smoothstep = (x) => x * x * (3 - 2 * x);
          let opacity = 1;
          if (t < 0.15) opacity = smoothstep(t / 0.15);
          else if (t > 0.82) opacity = smoothstep((1 - t) / 0.18);

          sl.dot.material.opacity = opacity * 0.8;

          const trailLen = 15;
          const trailEnd = idx1;
          const trailStart = Math.max(0, trailEnd - trailLen);
          const trailPts = [];
          for (let i = trailStart; i <= trailEnd; i++) trailPts.push(sl.arcPts[i]);
          if (trailPts.length >= 2) {
            sl.lineGeo.setFromPoints(trailPts);
            sl.lineMat.opacity = opacity * 0.3;
          }
        });

        particles.rotation.y = time * 0.008;
        composer.render();
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    }

        initMagnetic();

      celebrate() {
        const colors = ['#E07800', '#FF9A3C', '#FFD699', '#ffffff'];
        for (let i = 0; i < 30; i++) {
          const particle = document.createElement('div');
          particle.style.cssText = `
            position: fixed;
            width: 8px;
            height: 8px;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            left: 50%;
            top: 50%;
            opacity: 1;
          `;
          document.body.appendChild(particle);

          const angle = (Math.PI * 2 * i) / 30;
          const velocity = 5 + Math.random() * 10;
          const vx = Math.cos(angle) * velocity;
          const vy = Math.sin(angle) * velocity - 5;
          let x = 0, y = 0, opacity = 1;

          function animateParticle() {
            x += vx;
            y += vy + 0.5; // gravity
            opacity -= 0.02;
            particle.style.transform = `translate(${x}px, ${y}px)`;
            particle.style.opacity = opacity;
            if (opacity > 0) {
              requestAnimationFrame(animateParticle);
            } else {
              particle.remove();
            }
          }
          setTimeout(() => animateParticle(), i * 10);
        }
      }
    };

    // ============================================
    // CUSTOM CURSOR
    // ============================================
    function initCursor() {
      const cursor = document.getElementById('cursor');
      const cursorDot = document.getElementById('cursorDot');

      let mouseX = 0, mouseY = 0;
      let cursorX = 0, cursorY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        cursorDot.style.left = mouseX + 'px';
        cursorDot.style.top = mouseY + 'px';
      });

      // Smooth cursor follow
      function animateCursor() {
        cursorX += (mouseX - cursorX) * 0.15;
        cursorY += (mouseY - cursorY) * 0.15;
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      // Hover effect on interactive elements
      const hoverTargets = document.querySelectorAll('a, button, .action-card, .magnetic, input');
      hoverTargets.forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });
    }

    // ============================================
    // CHARACTER REVEAL ANIMATION
    // ============================================
    function initCharReveal() {
      const heroTitle = document.querySelector('.hero-title');
      if (!heroTitle) return;

      const lines = heroTitle.querySelectorAll('.line');
      lines.forEach((line, lineIndex) => {
        const word = line.querySelector('.word');
        if (!word) return;

        const text = word.textContent;
        word.innerHTML = '';

        // Check if it has gradient class
        const isGradient = word.classList.contains('gradient');

        text.split('').forEach((char, charIndex) => {
          const span = document.createElement('span');
          span.className = 'char-reveal';
          span.textContent = char === ' ' ? '\u00A0' : char;
          span.style.animationDelay = `${0.3 + lineIndex * 0.15 + charIndex * 0.025}s`;
          if (isGradient) {
            span.style.background = 'linear-gradient(135deg, var(--accent-woop) 0%, var(--accent-glow) 50%, var(--accent-woop) 100%)';
            span.style.backgroundSize = '200% 100%';
            span.style.webkitBackgroundClip = 'text';
            span.style.webkitTextFillColor = 'transparent';
            span.style.backgroundClip = 'text';
            span.style.animation = `charReveal 0.5s var(--ease-premium) ${0.3 + lineIndex * 0.15 + charIndex * 0.025}s forwards, shimmer 3s linear ${1.5 + charIndex * 0.02}s infinite`;
          }
          word.appendChild(span);
        });

        // Remove the old animation from word
        word.style.animation = 'none';
        word.style.opacity = '1';
        word.style.transform = 'none';
      });
    }

    // SCROLL PARALLAX
    // ============================================
    function initParallax() {
      const hero = document.querySelector('.hero');
      const chat = document.querySelector('.chat-container');

      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        if (hero) {
          hero.style.transform = `translateY(${scrollY * 0.3}px)`;
          hero.style.opacity = Math.max(0, 1 - scrollY / 400);
        }
        if (chat) {
          chat.style.transform = `translateY(${scrollY * -0.1}px)`;
        }
      }, { passive: true });
    }

    // ============================================
    // INITIALIZE HOVER LISTENERS FOR NEW ELEMENTS
    // ============================================
    function refreshCursorTargets() {
      const cursor = document.getElementById('cursor');
      const hoverTargets = document.querySelectorAll('a, button, .action-card, .magnetic, input');
      hoverTargets.forEach(el => {
        el.removeEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.removeEventListener('mouseleave', () => cursor.classList.remove('hover'));
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      initGlobe();
      initMagnetic();
      initCursor();
      initCharReveal();
      initParallax();
      killian.init();

      // Refresh cursor targets when cards are added
      const originalShowCards = killian.showCards.bind(killian);
      killian.showCards = function(options) {
        originalShowCards(options);
        setTimeout(refreshCursorTargets, 100);
      };
    });
  </script>
</body>
</html>
