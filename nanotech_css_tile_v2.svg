<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFAA44" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="tile-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Unit 1 (center-left) -->
  <g transform="translate(25, 90) rotate(-35)">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="url(#tile-edge)" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="2" fill="url(#tile-node)"/>
  </g>

  <!-- Unit 2 (top-right) -->
  <g transform="translate(90, 45) rotate(-35)">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="url(#tile-edge)" stroke-width="0.8" stroke-opacity="0.7"/>
    <path d="M 10 5 L 22 5 L 27 10 L 27 22 L 22 27 L 10 27 L 5 22 L 5 10 Z"
          fill="none" stroke="#FF8A00" stroke-width="0.4" stroke-opacity="0.3"/>
    <circle cx="16" cy="16" r="2" fill="url(#tile-node)"/>
  </g>

  <!-- Unit 3 (center) - peak brightness -->
  <g transform="translate(90, 110) rotate(-35)">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="url(#tile-edge)" stroke-width="1" stroke-opacity="0.9"/>
    <path d="M 10 5 L 22 5 L 27 10 L 27 22 L 22 27 L 10 27 L 5 22 L 5 10 Z"
          fill="none" stroke="#FF8A00" stroke-width="0.5" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="3" fill="url(#tile-node)"/>
    <circle cx="16" cy="16" r="1" fill="#FF8A00" fill-opacity="0.8"/>
  </g>

  <!-- Unit 4 (bottom-right) -->
  <g transform="translate(155, 90) rotate(-35)">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="url(#tile-edge)" stroke-width="0.6" stroke-opacity="0.35"/>
    <circle cx="16" cy="16" r="2" fill="url(#tile-node)" fill-opacity="0.5"/>
  </g>

  <!-- Cyan accent unit (stream A preview) -->
  <g transform="translate(55, 45) rotate(-35)">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="1.5" fill="#00E5FF" fill-opacity="0.3"/>
  </g>

  <!-- Faint trace units -->
  <g transform="translate(25, 155) rotate(-35)" opacity="0.15">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="#FF8A00" stroke-width="0.5"/>
  </g>

  <g transform="translate(155, 25) rotate(-35)" opacity="0.1">
    <path d="M 8 1 L 24 1 L 31 8 L 31 24 L 24 31 L 8 31 L 1 24 L 1 8 Z"
          fill="none" stroke="#FF8A00" stroke-width="0.4"/>
  </g>
</svg>
