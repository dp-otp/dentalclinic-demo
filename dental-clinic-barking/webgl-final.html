<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebGL Final</title>
    <style>
        body { margin: 0; background: #F5F1ED; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        console.log('THREE loaded:', THREE);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xF5F1ED);

        const camera = new THREE.OrthographicCamera(
            -window.innerWidth/2, window.innerWidth/2,
            window.innerHeight/2, -window.innerHeight/2,
            1, 1000
        );
        camera.position.z = 500;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        console.log('Scene, camera, renderer ready');

        // STEP: Add custom shaders with diagonal wave + simple idle breathing
        const vShader = `
            uniform float uTime;
            uniform float uWave;
            uniform vec2 uRes;
            uniform float uState;
            attribute vec3 aCenter;
            attribute float aId;
            varying vec3 vCol;
            varying float vOp;
            varying float vBright;
            void main() {
                vec2 sp = (aCenter.xy + uRes * 0.5) / uRes;
                float diag = sp.x * 0.819 + (1.0 - sp.y) * 0.574;
                float dist = abs(diag - uWave);

                vCol = vec3(0.0, 0.533, 0.471); // Teal
                vBright = 1.0;

                // INTRO: Diagonal wave
                if (uState < 0.5) {
                    if (dist < 0.08) {
                        vOp = 1.0;
                        vBright = 20.0;
                    } else if (dist < 0.15) {
                        vOp = 0.7;
                        vBright = 8.0;
                    } else if (dist < 0.25) {
                        vOp = 0.4;
                        vBright = 3.0;
                    } else {
                        vOp = 0.0;
                    }
                }
                // IDLE: Simple breathing
                else {
                    float breath = sin(uTime * 0.5 + aId * 0.1) * 0.5 + 0.5;
                    vOp = 0.4 + breath * 0.3;
                    vBright = 1.5 + breath * 2.0;
                }

                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fShader = `
            varying vec3 vCol;
            varying float vOp;
            varying float vBright;
            void main() {
                gl_FragColor = vec4(vCol * vBright, vOp);
            }
        `;

        const mat = new THREE.ShaderMaterial({
            vertexShader: vShader,
            fragmentShader: fShader,
            uniforms: {
                uTime: { value: 0 },
                uWave: { value: 0 },
                uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uState: { value: 0 }
            },
            transparent: true
        });

        console.log('Custom shaders created');

        const HR = 55, HW = HR * 1.732, HH = HR * 1.5;
        const cols = Math.ceil(window.innerWidth / HW) + 2;
        const rows = Math.ceil(window.innerHeight / HH) + 2;

        console.log(`Creating ${rows}x${cols} hexagons`);

        const SEGS = 30; // 30 segments per side
        let count = 0;

        for (let r = -1; r < rows; r++) {
            for (let c = -1; c < cols; c++) {
                const x = c * HW + (r % 2) * (HW / 2) - window.innerWidth / 2;
                const y = r * HH - window.innerHeight / 2;
                const hexId = r * cols + c;

                for (let layer = 0; layer < 3; layer++) {
                    const rad = HR + (layer - 1) * 3;

                    // 6 sides
                    for (let side = 0; side < 6; side++) {
                        const a1 = (Math.PI / 3) * side;
                        const a2 = (Math.PI / 3) * (side + 1);
                        const x1 = x + Math.cos(a1) * rad;
                        const y1 = y + Math.sin(a1) * rad;
                        const x2 = x + Math.cos(a2) * rad;
                        const y2 = y + Math.sin(a2) * rad;

                        // 30 segments per side
                        for (let seg = 0; seg < SEGS; seg++) {
                            const t1 = seg / SEGS;
                            const t2 = (seg + 1) / SEGS;
                            const px1 = x1 + (x2 - x1) * t1;
                            const py1 = y1 + (y2 - y1) * t1;
                            const px2 = x1 + (x2 - x1) * t2;
                            const py2 = y1 + (y2 - y1) * t2;
                            const geo = new THREE.BufferGeometry();
                            geo.setAttribute('position', new THREE.Float32BufferAttribute([
                                px1, py1, 0, px2, py2, 0
                            ], 3));
                            geo.setAttribute('aCenter', new THREE.Float32BufferAttribute([
                                x, y, 0, x, y, 0
                            ], 3));
                            geo.setAttribute('aId', new THREE.Float32BufferAttribute([hexId, hexId], 1));

                            scene.add(new THREE.LineSegments(geo, mat));
                            count++;
                        }
                    }
                }
            }
        }

        console.log(`Created ${count} segments (30 per side × 6 sides × 3 layers)`);

        let waveProgress = 0;
        let animState = 0; // 0 = intro, 1 = idle
        function animate() {
            requestAnimationFrame(animate);

            if (animState === 0) {
                waveProgress += 0.004;
                if (waveProgress >= 1.3) {
                    animState = 1; // Switch to idle
                    console.log('Switched to IDLE state - breathing');
                }
            }

            mat.uniforms.uWave.value = waveProgress;
            mat.uniforms.uTime.value = performance.now() * 0.001;
            mat.uniforms.uState.value = animState;

            renderer.render(scene, camera);
        }

        console.log('Starting diagonal wave animation (INTRO)');
        animate();
    </script>
</body>
</html>
