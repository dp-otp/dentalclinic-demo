<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic edge gradient -->
    <linearGradient id="metallic-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FFAA44" stop-opacity="1"/>
      <stop offset="65%" stop-color="#FF9922" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Inner filament gradient -->
    <linearGradient id="filament-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFAA44" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Center node glow -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF8A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer stroke (chamfered square / almost-hexagon) -->
  <path
    d="M 16 2 L 48 2 L 62 16 L 62 48 L 48 62 L 16 62 L 2 48 L 2 16 Z"
    fill="none"
    stroke="url(#metallic-edge)"
    stroke-width="1.5"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Inner filament ring -->
  <path
    d="M 20 8 L 44 8 L 56 20 L 56 44 L 44 56 L 20 56 L 8 44 L 8 20 Z"
    fill="none"
    stroke="url(#filament-grad)"
    stroke-width="0.75"
    stroke-linejoin="round"
  />

  <!-- Micro filament connectors -->
  <g stroke="#FF8A00" stroke-width="0.4" stroke-opacity="0.25">
    <line x1="16" y1="2" x2="20" y2="8"/>
    <line x1="48" y1="2" x2="44" y2="8"/>
    <line x1="62" y1="16" x2="56" y2="20"/>
    <line x1="62" y1="48" x2="56" y2="44"/>
    <line x1="48" y1="62" x2="44" y2="56"/>
    <line x1="16" y1="62" x2="20" y2="56"/>
    <line x1="2" y1="48" x2="8" y2="44"/>
    <line x1="2" y1="16" x2="8" y2="20"/>
  </g>

  <!-- Center micro-node with glow -->
  <circle cx="32" cy="32" r="4" fill="url(#node-glow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#FF8A00" fill-opacity="0.9"/>
</svg>
