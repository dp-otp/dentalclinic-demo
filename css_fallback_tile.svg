<!-- CSS Fallback Tile: Static Diagonal Pattern for Pure-CSS Animation -->
<!-- Tile size: 200×200px (seamless repeating) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .static-unit {
        fill: none;
        stroke: #D77A00;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.15;
      }
      .static-unit-dim {
        opacity: 0.06;
      }
      .static-unit-bright {
        opacity: 0.25;
      }
      .glow-soft {
        filter: url(#glow-filter);
      }
    </style>

    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Base unit: square with diagonally cut corners (scaled to fit tile) -->
    <path id="unit-small" d="M 4.5,0 L 27.5,0 L 32,4.5 L 32,27.5 L 27.5,32 L 4.5,32 L 0,27.5 L 0,4.5 Z"/>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0B0C0E"/>

  <!-- Diagonal grid pattern (bottom-left to top-right) -->

  <!-- Row 1: Bottom-left (dimmest) -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="10" y="150" transform="rotate(-4 26 166)"/>
  <use href="#unit-small" class="static-unit static-unit-dim" x="60" y="170" transform="rotate(3 76 186)"/>

  <!-- Row 2: Lower-middle diagonal -->
  <use href="#unit-small" class="static-unit" x="5" y="100" transform="rotate(2 21 116)"/>
  <use href="#unit-small" class="static-unit" x="55" y="120" transform="rotate(-3 71 136)"/>
  <use href="#unit-small" class="static-unit glow-soft" x="105" y="140" transform="rotate(4 121 156)"/>
  <use href="#unit-small" class="static-unit" x="155" y="160" transform="rotate(-2 171 176)"/>

  <!-- Row 3: Center diagonal (brightest) -->
  <use href="#unit-small" class="static-unit static-unit-bright glow-soft" x="0" y="50" transform="rotate(-3 16 66)"/>
  <use href="#unit-small" class="static-unit static-unit-bright glow-soft" x="50" y="70" transform="rotate(5 66 86)"/>
  <use href="#unit-small" class="static-unit static-unit-bright glow-soft" x="100" y="90" transform="rotate(-2 116 106)"/>
  <use href="#unit-small" class="static-unit static-unit-bright glow-soft" x="150" y="110" transform="rotate(3 166 126)"/>

  <!-- Row 4: Upper-middle diagonal -->
  <use href="#unit-small" class="static-unit" x="45" y="20" transform="rotate(4 61 36)"/>
  <use href="#unit-small" class="static-unit" x="95" y="40" transform="rotate(-3 111 56)"/>
  <use href="#unit-small" class="static-unit glow-soft" x="145" y="60" transform="rotate(2 161 76)"/>

  <!-- Row 5: Top-right (dimmest) -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="90" y="-10" transform="rotate(-4 106 6)"/>
  <use href="#unit-small" class="static-unit static-unit-dim" x="140" y="10" transform="rotate(3 156 26)"/>

  <!-- Edge units for seamless tiling (wraparound) -->
  <!-- Left edge wraps to right -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="-40" y="180" transform="rotate(2 -24 196)"/>
  <use href="#unit-small" class="static-unit" x="-45" y="130" transform="rotate(-3 -29 146)"/>

  <!-- Right edge wraps to left -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="190" y="30" transform="rotate(4 206 46)"/>
  <use href="#unit-small" class="static-unit" x="195" y="80" transform="rotate(-2 211 96)"/>

  <!-- Top edge wraps to bottom -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="40" y="-40" transform="rotate(3 56 -24)"/>

  <!-- Bottom edge wraps to top -->
  <use href="#unit-small" class="static-unit static-unit-dim" x="110" y="190" transform="rotate(-4 126 206)"/>

  <!-- Optional: Subtle noise texture -->
  <rect width="200" height="200" fill="url(#noise-pattern)" opacity="0.03"/>

  <defs>
    <pattern id="noise-pattern" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#0B0C0E"/>
      <circle cx="1" cy="1" r="0.5" fill="#D77A00"/>
      <circle cx="3" cy="2.5" r="0.5" fill="#00E5FF"/>
    </pattern>
  </defs>
</svg>
