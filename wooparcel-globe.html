<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WooParcel Globe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08080a; overflow: hidden; }
    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

  <script>
    fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
      .then(r => r.json())
      .then(geoData => createScene(geoData))
      .catch(() => createScene(null));

    function createScene(geoData) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08080a);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('container').appendChild(renderer.domElement);

      const composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.8, 0.5, 0.7
      );
      composer.addPass(bloomPass);

      const R = 1.7;
      const globeGroup = new THREE.Group();
      scene.add(globeGroup);
      // Start showing Europe/Africa FRONT AND CENTER
      globeGroup.rotation.y = -Math.PI * 0.15;

      function latLonToVec3(lat, lon, r) {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = (lon + 180) * Math.PI / 180;
        return new THREE.Vector3(
          -r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      const NEON_ORANGE = 0xE07800;
      const WHITE_GOLD = 0xFFF8F0;

      // Country borders
      if (geoData) {
        const countryMat = new THREE.LineBasicMaterial({ color: NEON_ORANGE, transparent: true, opacity: 0.65 });
        geoData.features.forEach(f => {
          const g = f.geometry;
          const draw = (coords) => {
            const pts = coords.map(c => latLonToVec3(c[1], c[0], R));
            if (pts.length > 2) globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), countryMat));
          };
          if (g.type === 'Polygon') g.coordinates.forEach(draw);
          else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => p.forEach(draw));
        });
      }

      // Grid
      const gridMat = new THREE.LineBasicMaterial({ color: NEON_ORANGE, transparent: true, opacity: 0.08 });
      for (let lat = -60; lat <= 60; lat += 30) {
        const pts = [];
        for (let lon = 0; lon <= 360; lon += 5) pts.push(latLonToVec3(lat, lon, R));
        globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }
      for (let lon = 0; lon < 360; lon += 30) {
        const pts = [];
        for (let lat = -90; lat <= 90; lat += 5) pts.push(latLonToVec3(lat, lon, R));
        globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }

      // Text rings along latitude lines
      function createLatTextRing(lat, text, direction = 1) {
        const canvas = document.createElement('canvas');
        canvas.width = 4096;
        canvas.height = 48;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Monospace tech font - slightly bigger
        ctx.font = '700 20px "Space Mono", monospace';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';

        // More repetitions so text doesn't stretch
        const fullText = text.repeat(16);

        // Neon orange glow
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(255, 140, 50, 0.8)';
        ctx.fillText(fullText, 0, canvas.height / 2);

        // Fade edges - top and bottom gradient overlay
        const fadeGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        fadeGrad.addColorStop(0, 'rgba(8,8,10,1)');
        fadeGrad.addColorStop(0.3, 'rgba(8,8,10,0)');
        fadeGrad.addColorStop(0.7, 'rgba(8,8,10,0)');
        fadeGrad.addColorStop(1, 'rgba(8,8,10,1)');
        ctx.fillStyle = fadeGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;

        // Calculate radius at this latitude
        const phi = (90 - lat) * Math.PI / 180;
        const ringRadius = R * Math.sin(phi) * 1.01;
        const ringY = R * Math.cos(phi);

        // Cylinder geometry - slightly taller
        const geo = new THREE.CylinderGeometry(ringRadius, ringRadius, 0.045, 64, 1, true);
        const mat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0.7,
          side: THREE.DoubleSide,
          depthTest: true,
          blending: THREE.AdditiveBlending
        });

        const ring = new THREE.Mesh(geo, mat);
        ring.position.y = ringY;
        ring.userData = { texture, direction };

        return ring;
      }

      // Add text rings at top and bottom grid lines
      const textRings = [];
      const ringData = [
        { lat: 60, text: 'WOOPARCEL · DELIVERING WORLDWIDE · ', dir: 1 },
        { lat: -60, text: 'SHIP SMARTER · GLOBAL REACH · ', dir: -1 }
      ];

      ringData.forEach(d => {
        const ring = createLatTextRing(d.lat, d.text, d.dir);
        globeGroup.add(ring);
        textRings.push(ring);
      });

      // Atmosphere
      const glowGeo = new THREE.SphereGeometry(R * 1.06, 64, 64);
      const glowMat = new THREE.ShaderMaterial({
        uniforms: { glowColor: { value: new THREE.Color(NEON_ORANGE) } },
        vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 glowColor; varying vec3 vNormal; void main() { float i = pow(0.5 - dot(vNormal, vec3(0,0,1)), 3.0); gl_FragColor = vec4(glowColor, i * 0.1); }`,
        side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true
      });
      globeGroup.add(new THREE.Mesh(glowGeo, glowMat));

      // ============================================
      // SHOOTING LINES - 11 lines spread across globe
      // ============================================
      const lineRoutes = [
        // TRANSATLANTIC - starts first
        { from: [5, -52], to: [14.7, -17.4] },         // French Guiana to Dakar (South America to West Africa)

        // MIDDLE (Europe/Africa) - mix of directions
        { from: [51.5, -0.12], to: [41.01, 28.98] },   // London to Istanbul (horizontal-ish)
        { from: [48.9, 2.35], to: [30.04, 31.24] },    // Paris to Cairo (diagonal)
        { from: [52.5, 13.4], to: [55.75, 37.6] },     // Berlin to Moscow (horizontal)
        { from: [59.3, 18.07], to: [25.3, 55.3] },     // Stockholm to Dubai (middle top-right diagonal)

        // LEFT SIDE (Americas) - more routes here
        { from: [40.7, -74], to: [34.05, -118.2] },    // NY to LA (horizontal)
        { from: [45.5, -73.6], to: [19.4, -99.1] },    // Montreal to Mexico City (diagonal)
        { from: [34.05, -118.2], to: [-23.5, -46.6] }, // LA to Sao Paulo (diagonal)
        { from: [37.8, -122.4], to: [49.3, -123.1] },  // SF to Vancouver (vertical-ish)

        // RIGHT SIDE (Asia)
        { from: [35.7, 139.7], to: [22.3, 114.2] },    // Tokyo to Hong Kong (diagonal)
        { from: [1.35, 103.8], to: [13.75, 100.5] },   // Singapore to Bangkok (horizontal)
      ];

      function createLineArc(from, to) {
        const start = latLonToVec3(from[0], from[1], R);
        const end = latLonToVec3(to[0], to[1], R);
        const pts = [];
        const dist = start.distanceTo(end);
        const height = Math.min(dist * 0.12, 0.25);

        for (let i = 0; i <= 60; i++) {
          const t = i / 60;
          const pt = new THREE.Vector3().lerpVectors(start, end, t);
          pt.normalize();
          pt.multiplyScalar(R * 1.02 + Math.sin(t * Math.PI) * height);
          pts.push(pt);
        }
        return pts;
      }

      // Create 11 lines - all same behavior
      const shootingLines = [];
      const LINE_COUNT = 11;
      const LINE_SPEED = 0.0018; // Same speed for all

      for (let i = 0; i < LINE_COUNT; i++) {
        const route = lineRoutes[i];
        const arcPts = createLineArc(route.from, route.to);

        const dot = new THREE.Mesh(
          new THREE.CircleGeometry(0.016, 16),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide
          })
        );

        const lineGeo = new THREE.BufferGeometry();
        const lineMat = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0
        });
        const line = new THREE.Line(lineGeo, lineMat);

        globeGroup.add(dot);
        globeGroup.add(line);

        shootingLines.push({
          dot,
          line,
          lineGeo,
          lineMat,
          arcPts,
          progress: i / LINE_COUNT, // Evenly spread start times
          speed: LINE_SPEED,
          routeIdx: i
        });
      }

      function updateShootingLines(fadeAmount) {
        shootingLines.forEach((sl) => {
          // Hide completely when fade is 0
          if (fadeAmount <= 0.01) {
            sl.dot.visible = false;
            sl.line.visible = false;
            return;
          }

          sl.dot.visible = true;
          sl.line.visible = true;

          sl.progress += sl.speed;

          if (sl.progress >= 1) {
            sl.progress = 0;
          }

          const t = sl.progress;
          const totalPts = sl.arcPts.length;

          const exactIdx = t * (totalPts - 1);
          const idx1 = Math.floor(exactIdx);
          const idx2 = Math.min(idx1 + 1, totalPts - 1);
          const frac = exactIdx - idx1;

          const pos = new THREE.Vector3().lerpVectors(sl.arcPts[idx1], sl.arcPts[idx2], frac);

          sl.dot.position.copy(pos);
          sl.dot.lookAt(0, 0, 0);

          // Smooth eased fade in/out using smoothstep
          const smoothstep = (x) => x * x * (3 - 2 * x);
          let opacity = 1;
          if (t < 0.15) opacity = smoothstep(t / 0.15);
          else if (t > 0.82) opacity = smoothstep((1 - t) / 0.18);

          // Apply zoom fade with smooth curve
          opacity *= smoothstep(fadeAmount);

          // Smooth threshold transition
          sl.dot.material.opacity = opacity * 0.95;

          const trailLen = 18;
          const trailEnd = idx1;
          const trailStart = Math.max(0, trailEnd - trailLen);
          const trailPts = [];

          for (let i = trailStart; i <= trailEnd; i++) {
            trailPts.push(sl.arcPts[i]);
          }

          if (trailPts.length >= 2) {
            sl.lineGeo.setFromPoints(trailPts);
            sl.lineMat.opacity = opacity * 0.5;
          } else {
            sl.lineMat.opacity = 0;
          }
        });
      }

      // Particles
      const partGeo = new THREE.BufferGeometry();
      const partPos = new Float32Array(100 * 3);
      for (let i = 0; i < 100; i++) {
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        const rad = R * (1.1 + Math.random() * 0.4);
        partPos[i*3] = rad * Math.sin(ph) * Math.cos(th);
        partPos[i*3+1] = rad * Math.sin(ph) * Math.sin(th);
        partPos[i*3+2] = rad * Math.cos(ph);
      }
      partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
      const particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ color: WHITE_GOLD, size: 0.008, transparent: true, opacity: 0.3 }));
      globeGroup.add(particles);

      // Core
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.015, 12, 12),
        new THREE.MeshBasicMaterial({ color: NEON_ORANGE, transparent: true, opacity: 0.6 })
      );
      globeGroup.add(core);

      // ============================================
      // ANIMATION - Smooth transition, NO CUT
      // ============================================
      const clock = new THREE.Clock();
      let time = 0;

      // Progress 0-1 for entire animation
      let progress = 0;
      const SPEED = 0.2; // FAST with velocity

      // Globe rotation - continuous
      let globeRotY = -Math.PI * 0.15; // Start showing Europe/Africa FRONT

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        time += delta;

        // Advance progress with velocity punch
        if (progress < 1) {
          // Accelerate in the middle for velocity feel
          const velocityBoost = 1 + Math.sin(progress * Math.PI) * 0.6;
          progress += delta * SPEED * velocityBoost;
          progress = Math.min(progress, 1);
        }

        // Smooth easing
        const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const e = ease(progress);

        // Camera: zoom IN continuously (Z goes from 4.5 to 0.1)
        const camZ = 4.5 - e * 4.4;
        const camFov = 50 + e * 25; // Wider inside view

        camera.position.set(0, 0, Math.max(camZ, 0.05));
        camera.fov = camFov;
        camera.updateProjectionMatrix();
        camera.lookAt(0, 0, 0);

        // Globe rotation - SAME PACE throughout (clockwise)
        globeRotY += 0.0012;
        globeGroup.rotation.y = globeRotY;

        // Floating effect only at start
        const floatAmt = Math.max(0, 1 - progress * 3);
        globeGroup.position.y = Math.sin(time * 1.5) * 0.03 * floatAmt;

        // Bloom - subtle glow
        bloomPass.strength = 0.6 + progress * 0.3;

        // Core - fade out when inside
        core.material.opacity = Math.max(0, 0.6 - progress * 0.8);
        core.scale.setScalar(1 + Math.sin(time * 2) * 0.1);

        // Particles
        particles.rotation.y = time * 0.01;
        particles.material.opacity = 0.3 * (1 - progress * 0.5);

        // Animate text rings - scroll texture
        textRings.forEach(ring => {
          ring.userData.texture.offset.x = time * 0.008 * ring.userData.direction;
        });

        // Update shooting lines - fade out smoothly when zooming in
        const lineFade = progress < 0.5 ? 1 : Math.max(0, 1 - (progress - 0.5) / 0.3);
        updateShootingLines(lineFade);

        composer.render();
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // Click to restart
      window.addEventListener('click', () => {
        if (progress > 0.95) {
          progress = 0;
          globeRotY = -Math.PI * 0.15;
          globeGroup.rotation.y = globeRotY;
        }
      });
    }
  </script>
</body>
</html>
